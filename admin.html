<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAKWO Admin</title><style>body{margin:0;background:#2b1309;color:#f6e7bb;font-family:Arial;padding:30px}.box{max-width:900px;margin:auto;background:#3a1e10;border:2px solid #d2a963;border-radius:12px;padding:22px}input,button,select{height:42px;margin:6px;padding:0 12px;border-radius:8px;border:1px solid #d2a963}button{background:#a32018;color:#fff;font-weight:900}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{border-bottom:1px solid #6a4222;padding:10px;text-align:left}</style></head><body><div class="box"><h1>JAKWO Admin</h1><div id="login"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="admin" class="hidden"><h2>Voucher Control</h2><p>Admin is hidden from public UI. Direct URL only.</p><select id="tier"><option value="1000">$1000 max 50</option><option value="500">$500 max 50</option><option value="100">$100 max 100</option><option value="0.5">$0.50 max 200</option></select><input id="qty" type="number" value="10"><button onclick="generate()">Generate</button><table><thead><tr><th>Code</th><th>Tier</th><th>Status</th></tr></thead><tbody id="codes"></tbody></table></div></div><script>const PASS='JAKWOADMIN2026';let codes=JSON.parse(localStorage.getItem('jakwo_codes')||'[]');function login(){if(pass.value===PASS){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');render()}else alert('Access denied')}function generate(){const t=tier.value; const limits={'1000':50,'500':50,'100':100,'0.5':200}; const existing=codes.filter(c=>c.tier===t).length; const n=Math.min(+qty.value, limits[t]-existing); if(n<=0)return alert('Max supply reached'); for(let i=0;i<n;i++)codes.push({code:'JAKWO-'+t.replace('.','')+'-'+Math.random().toString(36).slice(2,8).toUpperCase(),tier:t,status:'unused'}); localStorage.setItem('jakwo_codes',JSON.stringify(codes));render()}function render(){document.getElementById('codes').innerHTML=codes.map(c=>`<tr><td>${c.code}</td><td>$${c.tier}</td><td>${c.status}</td></tr>`).join('')}</script></body></html>
