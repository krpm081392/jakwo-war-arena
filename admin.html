<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAKWO Admin</title><style>body{margin:0;background:#2b1309;color:#f6e7bb;font-family:Arial;padding:30px}.box{max-width:1000px;margin:auto;background:#3a1e10;border:2px solid #d2a963;border-radius:12px;padding:22px}input,button,select{height:42px;margin:6px;padding:0 12px;border-radius:8px;border:1px solid #d2a963}button{background:#a32018;color:#fff;font-weight:900;cursor:pointer}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:20px;background:#2b1309}td,th{border-bottom:1px solid #6a4222;padding:10px;text-align:left}.used{color:#ff6767;font-weight:900}.unused{color:#28ff70;font-weight:900}.disabled{color:#aaa;font-weight:900}textarea{width:100%;height:130px;margin-top:12px;background:#130804;color:#f6e7bb;border:1px solid #d2a963;border-radius:8px;padding:10px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.sumcard{background:#130804;border:1px solid #d2a963;border-radius:10px;padding:12px}.sumcard b{display:block;font-size:22px;color:#28ff70}.sumcard span{font-size:12px;color:#f6e7bb}.tierSummary{margin:10px 0 18px;background:#130804;border:1px solid #6a4222;border-radius:8px;padding:10px;line-height:1.8;font-weight:800}</style></head><body><div class="box"><h1>JAKWO Admin</h1><div id="login"><input id="pass" type="password" placeholder="Admin password"><button onclick="login()">Login</button></div><div id="admin" class="hidden"><h2>Voucher Control</h2><p>Admin is hidden from public UI. Direct URL only. Vouchers are saved to Supabase when configured.</p><div class="summary"><div class="sumcard"><span>Total Vouchers</span><b id="sumTotal">0</b></div><div class="sumcard"><span>Unused</span><b id="sumUnused">0</b></div><div class="sumcard"><span>Used</span><b id="sumUsed">0</b></div><div class="sumcard"><span>Disabled</span><b id="sumDisabled">0</b></div></div><div id="tierSummary" class="tierSummary"></div><select id="tier"><option value="1000">$1000 max 50</option><option value="500">$500 max 50</option><option value="100">$100 max 100</option><option value="0.5">$0.50 max 200</option></select><input id="qty" type="number" value="10"><button onclick="generate()">Generate</button><button onclick="render()">Refresh</button><textarea id="copyBox" readonly placeholder="Generated codes appear here for copy paste"></textarea><table><thead><tr><th>Code</th><th>Tier</th><th>Status</th><th>Used By</th><th>Used At</th></tr></thead><tbody id="codes"></tbody></table></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.JAKWO_CONFIG||{};const PASS=cfg.ADMIN_PASSWORD||'JAKWOADMIN2026';const limits={'1000':50,'500':50,'100':100,'0.5':200};let localCodes=JSON.parse(localStorage.getItem('jakwo_codes')||'[]');const supa=(()=>{try{const url=cfg.supabaseUrl||cfg.NEXT_PUBLIC_SUPABASE_URL||'';const key=cfg.supabaseAnonKey||cfg.NEXT_PUBLIC_SUPABASE_ANON_KEY||'';if(window.supabase&&url&&key)return window.supabase.createClient(url,key)}catch(e){}return null})();
function login(){if(pass.value===PASS){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');render()}else alert('Access denied')}
function codeFor(t,n){return 'JAKWO-'+String(t).replace('.','D')+'-'+Math.random().toString(36).slice(2,8).toUpperCase()+'-'+String(n).padStart(3,'0')}
async function loadCodes(){if(supa){const {data,error}=await supa.from('voucher_codes').select('*').order('created_at',{ascending:false}).limit(1000);if(!error&&Array.isArray(data))return data.map(r=>({id:r.id,code:r.code,tier:String(r.tier),used:!!r.used,disabled:!!r.disabled,used_by:r.used_by||'',used_at:r.used_at||''}));console.warn('Voucher admin load failed',error)}return localCodes.map(c=>({code:c.code,tier:String(c.tier||c.value),used:c.status==='used'||c.used,disabled:c.disabled,used_by:c.used_by||'',used_at:c.used_at||''}))}
async function generate(){const t=tier.value;let all=await loadCodes();const made=all.filter(c=>String(c.tier)===String(t)).length;const n=Math.min(+qty.value||1,limits[t]-made);if(n<=0)return alert('Max supply reached for this tier');const rows=[];for(let i=0;i<n;i++)rows.push({code:codeFor(t,made+i+1),tier:Number(t),used:false,disabled:false});if(supa){const {error}=await supa.from('voucher_codes').insert(rows);if(error){alert('Supabase voucher insert failed: '+error.message);return}}else{localCodes.push(...rows.map(r=>({code:r.code,tier:String(r.tier),status:'unused'})));localStorage.setItem('jakwo_codes',JSON.stringify(localCodes))}document.getElementById('copyBox').value=rows.map(r=>r.code).join('\n');await render()}
async function render(){
 const all=await loadCodes();
 const total=all.length;
 const used=all.filter(c=>c.used).length;
 const disabled=all.filter(c=>c.disabled).length;
 const unused=all.filter(c=>!c.used && !c.disabled).length;
 document.getElementById('sumTotal').textContent=total;
 document.getElementById('sumUnused').textContent=unused;
 document.getElementById('sumUsed').textContent=used;
 document.getElementById('sumDisabled').textContent=disabled;
 document.getElementById('tierSummary').innerHTML=tiers.map(t=>{
   const rows=all.filter(c=>Number(c.tier)===Number(t.value));
   const u=rows.filter(c=>!c.used && !c.disabled).length;
   const usedRows=rows.filter(c=>c.used).length;
   const dis=rows.filter(c=>c.disabled).length;
   return `<div><b>$${t.value} ${t.name}</b>: ${u} unused / ${usedRows} used / ${dis} disabled / ${rows.length} generated / max ${t.max}</div>`;
 }).join('');
 document.getElementById('codes').innerHTML=all.map(c=>{const st=c.disabled?'DISABLED':c.used?'USED':'UNUSED';const cls=c.disabled?'disabled':c.used?'used':'unused';return `<tr><td>${c.code}</td><td>$${c.tier}</td><td class="${cls}">${st}</td><td>${c.used_by||''}</td><td>${c.used_at?new Date(c.used_at).toLocaleString():''}</td></tr>`}).join('');
}
</script></body></html>
